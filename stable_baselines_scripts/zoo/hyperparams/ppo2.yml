NeobotixSchunkBulletEnv-v0:
  env_wrapper: utils.wrappers.TimeFeatureWrapper
  normalize: true
  n_envs: 1
  n_timesteps: !!float 5e6
  policy: 'MlpPolicy'
  n_steps: 256
  nminibatches: 32
  lam: 0.92
  gamma: 0.99
  noptepochs: 10
  ent_coef: 0.02
  learning_rate: 0.00005
  cliprange: 0.1

